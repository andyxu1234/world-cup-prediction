<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" font-family="'Segoe UI', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <!-- Task node gradients -->
    <linearGradient id="syncGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="liveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="evalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="cacheGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="ondemandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#64748b"/>
      <stop offset="100%" style="stop-color:#475569"/>
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <!-- Arrow markers -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6ee7b7"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="960" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="600" y="52" text-anchor="middle" fill="#f1f5f9" font-size="26" font-weight="700" letter-spacing="1">
    ⚽ 世界杯预测系统 — 数据同步任务依赖关系图
  </text>
  <text x="600" y="78" text-anchor="middle" fill="#94a3b8" font-size="13">
    Data Sync Tasks Dependency Graph · APScheduler (AsyncIO) · 多联赛 / 赔率 / VIP 架构
  </text>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(30, 882)">
    <rect x="0" y="-15" width="1140" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8"/>
    <text x="20" y="10" fill="#94a3b8" font-size="12" font-weight="600">图例：</text>
    <rect x="70" y="-5" width="16" height="16" rx="3" fill="url(#syncGrad)"/>
    <text x="92" y="9" fill="#cbd5e1" font-size="12">数据同步任务</text>
    <rect x="200" y="-5" width="16" height="16" rx="3" fill="url(#aiGrad)"/>
    <text x="222" y="9" fill="#cbd5e1" font-size="12">AI 预测任务</text>
    <rect x="330" y="-5" width="16" height="16" rx="3" fill="url(#liveGrad)"/>
    <text x="352" y="9" fill="#cbd5e1" font-size="12">赔率同步</text>
    <rect x="450" y="-5" width="16" height="16" rx="3" fill="url(#cacheGrad)"/>
    <text x="472" y="9" fill="#cbd5e1" font-size="12">缓存预热</text>
    <rect x="580" y="-5" width="16" height="16" rx="3" fill="url(#ondemandGrad)"/>
    <text x="602" y="9" fill="#cbd5e1" font-size="12">按需/手动触发</text>
    <line x1="740" y1="3" x2="790" y2="3" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <text x="798" y="8" fill="#cbd5e1" font-size="12">强依赖</text>
    <line x1="870" y1="3" x2="920" y2="3" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowGray)"/>
    <text x="928" y="8" fill="#cbd5e1" font-size="12">弱依赖/懒加载</text>
    <line x1="1040" y1="3" x2="1090" y2="3" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowOrange)"/>
    <text x="1098" y="8" fill="#cbd5e1" font-size="12">事件驱动</text>
  </g>

  <!-- ============ SCHEDULE TIMELINE (left side) ============ -->
  <g transform="translate(42, 120)">
    <text x="0" y="0" fill="#64748b" font-size="11" font-weight="600" text-anchor="middle">调度时间</text>
    <line x1="0" y1="10" x2="0" y2="560" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
    <g fill="#94a3b8" font-size="11" text-anchor="end">
      <text x="-12" y="45">每 30 分</text>
      <circle cx="0" cy="42" r="3" fill="#3b82f6"/>
      <text x="-12" y="185">01:00</text>
      <circle cx="0" cy="182" r="3" fill="#8b5cf6"/>
      <text x="-12" y="325">02:00</text>
      <circle cx="0" cy="322" r="3" fill="#3b82f6"/>
      <text x="-12" y="465">04:00</text>
      <circle cx="0" cy="462" r="3" fill="#f59e0b"/>
      <text x="-12" y="630">每 5 分</text>
      <circle cx="0" cy="627" r="3" fill="#06b6d4"/>
    </g>
  </g>

  <!-- ============ DATA READY BUS (matches + teams) ============ -->
  <line x1="85" y1="170" x2="85" y2="610" stroke="#60a5fa" stroke-width="2"/>
  <line x1="110" y1="170" x2="85" y2="170" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="85" y1="320" x2="110" y2="320" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="85" y1="465" x2="110" y2="465" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="85" y1="610" x2="110" y2="610" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ============ LEFT COLUMN: periodic cron jobs ============ -->

  <!-- Task 1: sync_matches_and_respond -->
  <g transform="translate(110, 100)" filter="url(#shadow)">
    <rect width="320" height="140" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="320" height="36" rx="10" fill="url(#syncGrad)"/>
    <rect y="26" width="320" height="10" fill="url(#syncGrad)"/>
    <text x="16" y="25" fill="white" font-size="14" font-weight="700">① sync_matches_and_respond</text>
    <text x="304" y="25" fill="rgba(255,255,255,0.7)" font-size="10" text-anchor="end">每 30 分钟</text>
    <text x="16" y="58" fill="#cbd5e1" font-size="11">遍历 leagues 表所有 active 联赛</text>
    <text x="16" y="76" fill="#94a3b8" font-size="10">同步比赛 (Highlightly) + 事件驱动下游</text>
    <text x="16" y="94" fill="#94a3b8" font-size="10">新比赛→预取 H2H；比赛结束→stats+评估</text>
    <text x="16" y="112" fill="#6ee7b7" font-size="10">▸ /admin/pipeline/sync · /matches/sync</text>
    <text x="16" y="130" fill="#6ee7b7" font-size="10">▸ /h2h/sync · /stats/sync · /predictions/evaluate</text>
  </g>

  <!-- Task 2: generate_predictions -->
  <g transform="translate(110, 260)" filter="url(#shadow)">
    <rect width="320" height="120" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <rect width="320" height="36" rx="10" fill="url(#aiGrad)"/>
    <rect y="26" width="320" height="10" fill="url(#aiGrad)"/>
    <text x="16" y="25" fill="white" font-size="14" font-weight="700">② generate_predictions</text>
    <text x="304" y="25" fill="rgba(255,255,255,0.7)" font-size="10" text-anchor="end">每日 01:00</text>
    <text x="16" y="58" fill="#cbd5e1" font-size="11">LangGraph 多模型 AI 预测 (OfoxAI 网关)</text>
    <text x="16" y="76" fill="#94a3b8" font-size="10">输入: 比赛 + 球队统计 + 近期战绩 + H2H</text>
    <text x="16" y="94" fill="#fbbf24" font-size="10">⚠ 懒加载: H2H 缺失时自动触发 API</text>
    <text x="16" y="112" fill="#6ee7b7" font-size="10">▸ /admin/predictions/generate</text>
  </g>

  <!-- Task 3: sync_standings_and_stats -->
  <g transform="translate(110, 400)" filter="url(#shadow)">
    <rect width="320" height="130" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="320" height="36" rx="10" fill="url(#syncGrad)"/>
    <rect y="26" width="320" height="10" fill="url(#syncGrad)"/>
    <text x="16" y="25" fill="white" font-size="14" font-weight="700">③ sync_standings_and_stats</text>
    <text x="304" y="25" fill="rgba(255,255,255,0.7)" font-size="10" text-anchor="end">每日 02:00</text>
    <text x="16" y="58" fill="#cbd5e1" font-size="11">同步积分榜 + 球队统计 + 近期战绩</text>
    <text x="16" y="76" fill="#94a3b8" font-size="10">API: Highlightly → standings / team_statistics</text>
    <text x="16" y="94" fill="#94a3b8" font-size="10">输出: group_name, season_stats, recent_form</text>
    <text x="16" y="112" fill="#6ee7b7" font-size="10">▸ /admin/standings/sync</text>
    <text x="16" y="128" fill="#6ee7b7" font-size="10">▸ /admin/player-stats/sync</text>
  </g>

  <!-- Task 4: sync_odds -->
  <g transform="translate(110, 550)" filter="url(#shadow)">
    <rect width="320" height="120" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect width="320" height="36" rx="10" fill="url(#liveGrad)"/>
    <rect y="26" width="320" height="10" fill="url(#liveGrad)"/>
    <text x="16" y="25" fill="white" font-size="14" font-weight="700">④ sync_odds</text>
    <text x="304" y="25" fill="rgba(255,255,255,0.7)" font-size="10" text-anchor="end">每日 04:00</text>
    <text x="16" y="58" fill="#cbd5e1" font-size="11">同步未来 7 天赛前赔率 (prematch)</text>
    <text x="16" y="76" fill="#94a3b8" font-size="10">API: Highlightly → odds (多 bookmaker)</text>
    <text x="16" y="94" fill="#94a3b8" font-size="10">追加快照到 match_odds (幂等去重)</text>
    <text x="16" y="112" fill="#6ee7b7" font-size="10">▸ /admin/odds/sync · /odds/sync-league</text>
  </g>

  <!-- ============ MIDDLE COLUMN ============ -->

  <!-- Task 5: refresh_all_caches -->
  <g transform="translate(460, 100)" filter="url(#shadow)">
    <rect width="320" height="110" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <rect width="320" height="36" rx="10" fill="url(#cacheGrad)"/>
    <rect y="26" width="320" height="10" fill="url(#cacheGrad)"/>
    <text x="16" y="25" fill="white" font-size="14" font-weight="700">⑤ refresh_all_caches</text>
    <text x="304" y="25" fill="rgba(255,255,255,0.7)" font-size="10" text-anchor="end">每 5 分钟</text>
    <text x="16" y="58" fill="#cbd5e1" font-size="11">预热只读缓存，降低 DB 压力</text>
    <text x="16" y="76" fill="#94a3b8" font-size="10">matches / stats / predictions /</text>
    <text x="16" y="94" fill="#94a3b8" font-size="10">leaderboard / standings / player_rankings</text>
  </g>

  <!-- evaluate_predictions (event-driven) -->
  <g transform="translate(460, 240)" filter="url(#shadow)">
    <rect width="320" height="120" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="320" height="36" rx="10" fill="url(#evalGrad)"/>
    <rect y="26" width="320" height="10" fill="url(#evalGrad)"/>
    <text x="16" y="25" fill="white" font-size="14" font-weight="700">evaluate_predictions</text>
    <text x="304" y="25" fill="rgba(255,255,255,0.7)" font-size="10" text-anchor="end">事件驱动</text>
    <text x="16" y="58" fill="#cbd5e1" font-size="11">预测准确性评估 (纯 DB 操作)</text>
    <text x="16" y="76" fill="#94a3b8" font-size="10">由 ① 在比赛结束后触发</text>
    <text x="16" y="94" fill="#94a3b8" font-size="10">评估 AI / 用户投票 is_correct_result</text>
    <text x="16" y="112" fill="#6ee7b7" font-size="9">▸ /admin/predictions/evaluate · /reevaluate</text>
  </g>

  <!-- ============ RIGHT COLUMN: on-demand / manual ============ -->

  <!-- Task 6: get_h2h_data -->
  <g transform="translate(800, 100)" filter="url(#shadow)">
    <rect width="250" height="90" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect width="250" height="30" rx="8" fill="url(#ondemandGrad)"/>
    <rect y="22" width="250" height="8" fill="url(#ondemandGrad)"/>
    <text x="12" y="22" fill="white" font-size="12" font-weight="600">⑥ get_h2h_data</text>
    <text x="12" y="52" fill="#cbd5e1" font-size="10">懒加载 H2H 数据</text>
    <text x="12" y="70" fill="#94a3b8" font-size="9">缓存未命中时触发 Highlightly</text>
    <text x="12" y="86" fill="#94a3b8" font-size="9">被 ① / ② 调用</text>
  </g>

  <!-- Task 7: sync_league_odds -->
  <g transform="translate(800, 210)" filter="url(#shadow)">
    <rect width="250" height="90" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect width="250" height="30" rx="8" fill="url(#ondemandGrad)"/>
    <rect y="22" width="250" height="8" fill="url(#ondemandGrad)"/>
    <text x="12" y="22" fill="white" font-size="12" font-weight="600">⑦ sync_league_odds</text>
    <text x="12" y="52" fill="#cbd5e1" font-size="10">按联赛同步赔率 (一次性)</text>
    <text x="12" y="70" fill="#94a3b8" font-size="9">POST /admin/odds/sync-league</text>
    <text x="12" y="86" fill="#94a3b8" font-size="9">Highlightly → odds (league 范围)</text>
  </g>

  <!-- Task 8: clone_league -->
  <g transform="translate(800, 320)" filter="url(#shadow)">
    <rect width="250" height="90" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect width="250" height="30" rx="8" fill="url(#ondemandGrad)"/>
    <rect y="22" width="250" height="8" fill="url(#ondemandGrad)"/>
    <text x="12" y="22" fill="white" font-size="12" font-weight="600">⑧ clone_league</text>
    <text x="12" y="52" fill="#cbd5e1" font-size="10">联赛克隆 / 赛季回填</text>
    <text x="12" y="70" fill="#94a3b8" font-size="9">POST /admin/leagues/clone</text>
    <text x="12" y="86" fill="#94a3b8" font-size="9">Highlightly → league / season</text>
  </g>

  <!-- ============ EXTERNAL API SOURCES ============ -->
  <g transform="translate(800, 440)">
    <rect width="250" height="150" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" opacity="0.9"/>
    <text x="125" y="25" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">外部数据源</text>
    <line x1="15" y1="35" x2="235" y2="35" stroke="#334155" stroke-width="1"/>

    <!-- Highlightly -->
    <rect x="15" y="48" width="220" height="42" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="25" y="65" fill="#60a5fa" font-size="11" font-weight="600">Highlightly API</text>
    <text x="25" y="82" fill="#94a3b8" font-size="9">matches, standings, h2h, stats, odds</text>

    <!-- OfoxAI -->
    <rect x="15" y="100" width="220" height="42" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="25" y="117" fill="#a78bfa" font-size="11" font-weight="600">OfoxAI 网关</text>
    <text x="25" y="134" fill="#94a3b8" font-size="9">多模型 AI 预测 (OpenAI 兼容)</text>
  </g>

  <!-- ============ DEPENDENCY ARROWS ============ -->

  <!-- ① → external (Highlightly) -->
  <path d="M430,220 L800,220 L800,440" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,3" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="445" y="213" fill="#fbbf24" font-size="9">Highlightly: matches/h2h/stats</text>

  <!-- ② → external (OfoxAI) -->
  <path d="M430,260 L430,90 L800,90 L800,560" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6,3" fill="none" marker-end="url(#arrowPurple)"/>
  <text x="445" y="100" fill="#a78bfa" font-size="9">OfoxAI 多模型预测</text>

  <!-- ④ → external (odds) -->
  <path d="M430,610 L800,610 L800,560" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,3" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="470" y="602" fill="#fbbf24" font-size="9">Highlightly: odds</text>

  <!-- ① → evaluate (event-driven) -->
  <path d="M430,200 Q520,200 520,300 Q520,310 460,310" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,3" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="468" y="255" fill="#fbbf24" font-size="9">比赛结束→事件驱动</text>

  <!-- ② → evaluate (pending) -->
  <line x1="430" y1="310" x2="460" y2="310" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowPurple)"/>
  <text x="432" y="302" fill="#a78bfa" font-size="9">生成预测→待评估</text>

  <!-- ② ⇢ ⑥ get_h2h_data (lazy) -->
  <path d="M430,230 L770,230 L770,145 L800,145" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,3" fill="none" marker-end="url(#arrowGray)"/>
  <text x="500" y="222" fill="#94a3b8" font-size="9">H2H 缺失时懒加载</text>

  <!-- ④ → ⑦ sync_league_odds (variant) -->
  <path d="M430,650 L790,650 L790,255 L800,255" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,3" fill="none" marker-end="url(#arrowGray)"/>
  <text x="500" y="642" fill="#94a3b8" font-size="9">按联赛的赔率变体</text>

  <!-- ============ DEPENDENCY SUMMARY ============ -->
  <g transform="translate(60, 700)">
    <rect width="1080" height="170" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.9"/>
    <text x="540" y="26" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">依赖关系总结</text>
    <line x1="20" y1="38" x2="1060" y2="38" stroke="#334155" stroke-width="1"/>

    <!-- Left column -->
    <circle cx="30" cy="72" r="4" fill="#3b82f6"/>
    <text x="42" y="76" fill="#cbd5e1" font-size="11" font-weight="600">sync_matches_and_respond → ②③④</text>
    <text x="42" y="92" fill="#94a3b8" font-size="10">提供 matches+teams（含 highlightly_team_id），是所有任务的基础</text>

    <circle cx="30" cy="116" r="4" fill="#f59e0b"/>
    <text x="42" y="120" fill="#cbd5e1" font-size="11" font-weight="600">① 事件驱动 → evaluate_predictions</text>
    <text x="42" y="136" fill="#94a3b8" font-size="10">比赛结束写入 result 后，自动触发准确性评估</text>

    <circle cx="30" cy="160" r="4" fill="#8b5cf6"/>
    <text x="42" y="164" fill="#cbd5e1" font-size="11" font-weight="600">generate_predictions ⇢ get_h2h_data</text>
    <text x="42" y="180" fill="#94a3b8" font-size="10">H2H 缺失时懒加载兜底（缓存未命中触发）</text>

    <!-- Right column -->
    <circle cx="560" cy="72" r="4" fill="#3b82f6"/>
    <text x="572" y="76" fill="#cbd5e1" font-size="11" font-weight="600">③ sync_standings_and_stats</text>
    <text x="572" y="92" fill="#94a3b8" font-size="10">积分榜/球队统计供数据页与次日预测使用</text>

    <circle cx="560" cy="116" r="4" fill="#f59e0b"/>
    <text x="572" y="120" fill="#cbd5e1" font-size="11" font-weight="600">④ sync_odds → match_odds</text>
