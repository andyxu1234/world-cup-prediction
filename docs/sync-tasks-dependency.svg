<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="'Segoe UI', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <!-- Task node gradients -->
    <linearGradient id="syncGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="liveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="evalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="ondemandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#64748b"/>
      <stop offset="100%" style="stop-color:#475569"/>
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Arrow marker -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6ee7b7"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="600" y="52" text-anchor="middle" fill="#f1f5f9" font-size="26" font-weight="700" letter-spacing="1">
    ⚽ 世界杯预测系统 — 数据同步任务依赖关系图
  </text>
  <text x="600" y="78" text-anchor="middle" fill="#94a3b8" font-size="13">
    Data Sync Tasks Dependency Graph · APScheduler (AsyncIO)
  </text>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(30, 830)">
    <rect x="0" y="-15" width="1140" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8"/>
    <text x="20" y="10" fill="#94a3b8" font-size="12" font-weight="600">图例：</text>
    <!-- Data sync -->
    <rect x="70" y="-5" width="16" height="16" rx="3" fill="url(#syncGrad)"/>
    <text x="92" y="9" fill="#cbd5e1" font-size="12">数据同步任务</text>
    <!-- AI -->
    <rect x="200" y="-5" width="16" height="16" rx="3" fill="url(#aiGrad)"/>
    <text x="222" y="9" fill="#cbd5e1" font-size="12">AI 预测任务</text>
    <!-- Live -->
    <rect x="330" y="-5" width="16" height="16" rx="3" fill="url(#liveGrad)"/>
    <text x="352" y="9" fill="#cbd5e1" font-size="12">实时比分同步</text>
    <!-- Eval -->
    <rect x="480" y="-5" width="16" height="16" rx="3" fill="url(#evalGrad)"/>
    <text x="502" y="9" fill="#cbd5e1" font-size="12">评估任务</text>
    <!-- On-demand -->
    <rect x="600" y="-5" width="16" height="16" rx="3" fill="url(#ondemandGrad)"/>
    <text x="622" y="9" fill="#cbd5e1" font-size="12">按需/懒加载</text>
    <!-- Arrow types -->
    <line x1="740" y1="3" x2="790" y2="3" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <text x="798" y="8" fill="#cbd5e1" font-size="12">强依赖</text>
    <line x1="870" y1="3" x2="920" y2="3" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowGray)"/>
    <text x="928" y="8" fill="#cbd5e1" font-size="12">弱依赖/懒加载</text>
    <line x1="1040" y1="3" x2="1090" y2="3" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowOrange)"/>
    <text x="1098" y="8" fill="#cbd5e1" font-size="12">数据流</text>
  </g>

  <!-- ============ SCHEDULE TIMELINE (left side) ============ -->
  <g transform="translate(42, 120)">
    <text x="0" y="0" fill="#64748b" font-size="11" font-weight="600" text-anchor="middle">调度时间</text>
    <line x1="0" y1="10" x2="0" y2="580" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
    <!-- Time markers -->
    <g fill="#94a3b8" font-size="11" text-anchor="end">
      <text x="-12" y="45">00:00</text>
      <circle cx="0" cy="42" r="3" fill="#3b82f6"/>
      <text x="-12" y="185">00:30</text>
      <circle cx="0" cy="182" r="3" fill="#3b82f6"/>
      <text x="-12" y="325">00:45</text>
      <circle cx="0" cy="322" r="3" fill="#3b82f6"/>
      <text x="-12" y="465">01:00</text>
      <circle cx="0" cy="462" r="3" fill="#8b5cf6"/>
    </g>
    <text x="-12" y="630" fill="#94a3b8" font-size="11" text-anchor="end">*/30 min</text>
    <circle cx="0" cy="627" r="3" fill="#10b981"/>
  </g>

  <!-- ============ MAIN PIPELINE (left column) ============ -->

  <!-- Task 1: sync_matches -->
  <g transform="translate(120, 100)" filter="url(#shadow)">
    <rect width="320" height="120" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="320" height="36" rx="10" fill="url(#syncGrad)"/>
    <rect y="26" width="320" height="10" fill="url(#syncGrad)"/>
    <text x="16" y="25" fill="white" font-size="14" font-weight="700">① sync_matches</text>
    <text x="304" y="25" fill="rgba(255,255,255,0.7)" font-size="10" text-anchor="end">每日 00:00</text>
    <text x="16" y="58" fill="#cbd5e1" font-size="11">全量同步世界杯比赛数据</text>
    <text x="16" y="76" fill="#94a3b8" font-size="10">API: Highlightly → get_all_world_cup_matches()</text>
    <text x="16" y="94" fill="#94a3b8" font-size="10">输出: Match + Team 记录 (含 highlightly_team_id)</text>
    <text x="16" y="112" fill="#6ee7b7" font-size="10">▸ 手动触发: POST /admin/matches/sync</text>
  </g>

  <!-- Arrow: sync_matches → sync_standings_and_stats -->
  <line x1="280" y1="220" x2="280" y2="248" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="290" y="240" fill="#60a5fa" font-size="9" font-weight="600">提供: matches + teams</text>

  <!-- Task 2: sync_standings_and_stats -->
  <g transform="translate(120, 250)" filter="url(#shadow)">
    <rect width="320" height="135" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="320" height="36" rx="10" fill="url(#syncGrad)"/>
    <rect y="26" width="320" height="10" fill="url(#syncGrad)"/>
    <text x="16" y="25" fill="white" font-size="14" font-weight="700">② sync_standings_and_stats</text>
    <text x="304" y="25" fill="rgba(255,255,255,0.7)" font-size="10" text-anchor="end">每日 00:30</text>
    <text x="16" y="58" fill="#cbd5e1" font-size="11">同步积分榜 + 球队统计 + 近期战绩</text>
    <text x="16" y="76" fill="#94a3b8" font-size="10">API: Highlightly → standings / team_statistics</text>
    <text x="16" y="94" fill="#94a3b8" font-size="10">  / last_five_games / head_to_head</text>
    <text x="16" y="112" fill="#94a3b8" font-size="10">输出: group_name, season_stats, recent_form</text>
    <text x="16" y="128" fill="#6ee7b7" font-size="10">▸ 手动触发: POST /admin/stats/sync</text>
  </g>

  <!-- Arrow: sync_standings_and_stats → sync_all_h2h -->
  <line x1="280" y1="385" x2="280" y2="413" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="290" y="405" fill="#60a5fa" font-size="9" font-weight="600">提供: highlightly_team_id</text>

  <!-- Task 3: sync_all_h2h -->
  <g transform="translate(120, 415)" filter="url(#shadow)">
    <rect width="320" height="120" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="320" height="36" rx="10" fill="url(#syncGrad)"/>
    <rect y="26" width="320" height="10" fill="url(#syncGrad)"/>
    <text x="16" y="25" fill="white" font-size="14" font-weight="700">③ sync_all_h2h</text>
    <text x="304" y="25" fill="rgba(255,255,255,0.7)" font-size="10" text-anchor="end">每日 00:45</text>
    <text x="16" y="58" fill="#cbd5e1" font-size="11">同步所有即将比赛的对战记录 (H2H)</text>
    <text x="16" y="76" fill="#94a3b8" font-size="10">API: Highlightly → get_head_to_head()</text>
    <text x="16" y="94" fill="#94a3b8" font-size="10">输出: head_to_head 记录 (幂等, 跳过已有)</text>
    <text x="16" y="112" fill="#6ee7b7" font-size="10">▸ 手动触发: POST /admin/h2h/sync</text>
  </g>

  <!-- Arrow: sync_all_h2h → generate_predictions -->
  <line x1="280" y1="535" x2="280" y2="563" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="290" y="555" fill="#60a5fa" font-size="9" font-weight="600">提供: H2H 数据</text>

  <!-- Task 4: generate_predictions -->
  <g transform="translate(120, 565)" filter="url(#shadow)">
    <rect width="320" height="130" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <rect width="320" height="36" rx="10" fill="url(#aiGrad)"/>
    <rect y="26" width="320" height="10" fill="url(#aiGrad)"/>
    <text x="16" y="25" fill="white" font-size="14" font-weight="700">④ generate_predictions</text>
    <text x="304" y="25" fill="rgba(255,255,255,0.7)" font-size="10" text-anchor="end">每日 01:00</text>
    <text x="16" y="58" fill="#cbd5e1" font-size="11">AI 预测生成 (DeepSeek 多模型)</text>
    <text x="16" y="76" fill="#94a3b8" font-size="10">API: DeepSeek/OfoxAI → 结构化 JSON 预测</text>
    <text x="16" y="94" fill="#94a3b8" font-size="10">输入: 比赛数据 + 球队统计 + 近期战绩 + H2H</text>
    <text x="16" y="112" fill="#fbbf24" font-size="10">⚠ 懒加载: 若 H2H 缺失会自动触发 API 调用</text>
    <text x="16" y="128" fill="#6ee7b7" font-size="10">▸ 手动触发: POST /admin/predictions/generate</text>
  </g>

  <!-- ============ RIGHT COLUMN: Live + Eval pipeline ============ -->

  <!-- Task 6: sync_live_scores -->
  <g transform="translate(580, 100)" filter="url(#shadow)">
    <rect width="320" height="120" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect width="320" height="36" rx="10" fill="url(#liveGrad)"/>
    <rect y="26" width="320" height="10" fill="url(#liveGrad)"/>
    <text x="16" y="25" fill="white" font-size="14" font-weight="700">⑥ sync_live_scores</text>
    <text x="304" y="25" fill="rgba(255,255,255,0.7)" font-size="10" text-anchor="end">每30分钟 12:00-06:00</text>
    <text x="16" y="58" fill="#cbd5e1" font-size="11">实时比分同步 (轻量级)</text>
    <text x="16" y="76" fill="#94a3b8" font-size="10">API: Highlightly → get_matches_by_date()</text>
    <text x="16" y="94" fill="#94a3b8" font-size="10">更新: match.status, home_score, away_score, result</text>
    <text x="16" y="112" fill="#94a3b8" font-size="10">节省配额: 仅查询今日/明日比赛</text>
  </g>

  <!-- Arrow: sync_live_scores → evaluate_predictions -->
  <path d="M740,220 L740,248" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowOrange)"/>
  <text x="750" y="240" fill="#fbbf24" font-size="9">提供: 比赛结果</text>

  <!-- Arrow: sync_matches also feeds into evaluate (via setting match results) -->
  <path d="M440,160 L580,160" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowBlue)"/>
  <text x="490" y="153" fill="#94a3b8" font-size="9">数据来源之一</text>

  <!-- Task 5: evaluate_predictions -->
  <g transform="translate(580, 250)" filter="url(#shadow)">
    <rect width="320" height="120" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="320" height="36" rx="10" fill="url(#evalGrad)"/>
    <rect y="26" width="320" height="10" fill="url(#evalGrad)"/>
    <text x="16" y="25" fill="white" font-size="14" font-weight="700">⑤ evaluate_predictions</text>
    <text x="304" y="25" fill="rgba(255,255,255,0.7)" font-size="10" text-anchor="end">每30分钟</text>
    <text x="16" y="58" fill="#cbd5e1" font-size="11">预测准确性评估</text>
    <text x="16" y="76" fill="#94a3b8" font-size="10">无外部 API 调用, 纯数据库操作</text>
    <text x="16" y="94" fill="#94a3b8" font-size="10">评估: AI预测 + 用户投票 的 is_correct_result/score</text>
    <text x="16" y="112" fill="#6ee7b7" font-size="10">▸ 手动触发: POST /admin/predictions/evaluate</text>
  </g>

  <!-- Arrow: generate_predictions → evaluate_predictions -->
  <path d="M440,630 Q510,630 510,380 Q510,310 580,310" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowPurple)"/>
  <text x="500" y="480" fill="#a78bfa" font-size="9" transform="rotate(-90, 500, 480)">生成预测后待评估</text>

  <!-- ============ ON-DEMAND TASKS (right side) ============ -->

  <!-- Section label -->
  <text x="940" y="112" fill="#64748b" font-size="13" font-weight="600">按需 / 懒加载任务</text>
  <line x1="940" y1="118" x2="1160" y2="118" stroke="#334155" stroke-width="1"/>

  <!-- Task 7: sync_head_to_head_for_match -->
  <g transform="translate(940, 130)" filter="url(#shadow)">
    <rect width="230" height="90" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect width="230" height="30" rx="8" fill="url(#ondemandGrad)"/>
    <rect y="22" width="230" height="8" fill="url(#ondemandGrad)"/>
    <text x="12" y="22" fill="white" font-size="12" font-weight="600">⑦ sync_h2h_for_match</text>
    <text x="12" y="50" fill="#cbd5e1" font-size="10">按需同步单场比赛 H2H</text>
    <text x="12" y="66" fill="#94a3b8" font-size="9">API: Highlightly → h2h</text>
    <text x="12" y="82" fill="#94a3b8" font-size="9">来源: stats_sync.py:185</text>
  </g>

  <!-- Task 8: get_head_to_head_data -->
  <g transform="translate(940, 240)" filter="url(#shadow)">
    <rect width="230" height="90" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect width="230" height="30" rx="8" fill="url(#ondemandGrad)"/>
    <rect y="22" width="230" height="8" fill="url(#ondemandGrad)"/>
    <text x="12" y="22" fill="white" font-size="12" font-weight="600">⑧ get_h2h_data</text>
    <text x="12" y="50" fill="#cbd5e1" font-size="10">懒加载 H2H 数据</text>
    <text x="12" y="66" fill="#94a3b8" font-size="9">缓存未命中时触发 ⑦</text>
    <text x="12" y="82" fill="#94a3b8" font-size="9">来源: stats_sync.py:258</text>
  </g>

  <!-- Task 9: seed_all -->
  <g transform="translate(940, 350)" filter="url(#shadow)">
    <rect width="230" height="90" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect width="230" height="30" rx="8" fill="url(#ondemandGrad)"/>
    <rect y="22" width="230" height="8" fill="url(#ondemandGrad)"/>
    <text x="12" y="22" fill="white" font-size="12" font-weight="600">⑨ seed_all</text>
    <text x="12" y="50" fill="#cbd5e1" font-size="10">数据库初始化/种子数据</text>
    <text x="12" y="66" fill="#94a3b8" font-size="9">一次性任务, 非周期性</text>
    <text x="12" y="82" fill="#6ee7b7" font-size="9">▸ POST /admin/seed</text>
  </g>

  <!-- Arrow: generate_predictions → get_h2h_data (lazy dependency) -->
  <path d="M440,610 Q830,610 830,285 Q830,275 940,275" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowGray)"/>
  <text x="830" y="440" fill="#94a3b8" font-size="9" transform="rotate(-90, 830, 440)">H2H 缺失时懒加载</text>

  <!-- Arrow: get_h2h_data → sync_h2h_for_match -->
  <path d="M1055,240 L1055,222" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGray)"/>

  <!-- ============ DEPENDENCY SUMMARY ============ -->
  <g transform="translate(580, 430)">
    <rect width="580" height="340" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.9"/>
    <text x="290" y="30" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">依赖关系总结</text>
    <line x1="20" y1="42" x2="560" y2="42" stroke="#334155" stroke-width="1"/>

    <!-- Dependency 1 -->
    <circle cx="30" cy="70" r="4" fill="#3b82f6"/>
    <text x="42" y="74" fill="#cbd5e1" font-size="11" font-weight="600">sync_matches → sync_standings_and_stats</text>
    <text x="42" y="90" fill="#94a3b8" font-size="10">standings 需要 highlightly_team_id，由 sync_matches 的 _upsert_team() 写入</text>

    <!-- Dependency 2 -->
    <circle cx="30" cy="115" r="4" fill="#3b82f6"/>
    <text x="42" y="119" fill="#cbd5e1" font-size="11" font-weight="600">sync_standings_and_stats → sync_all_h2h</text>
    <text x="42" y="135" fill="#94a3b8" font-size="10">H2H 同步需要两支球队的 highlightly_team_id (standings 也会更新)</text>

    <!-- Dependency 3 -->
    <circle cx="30" cy="160" r="4" fill="#8b5cf6"/>
    <text x="42" y="164" fill="#cbd5e1" font-size="11" font-weight="600">前三个同步任务 → generate_predictions</text>
    <text x="42" y="180" fill="#94a3b8" font-size="10">AI 预测需要比赛 + 球队统计 + 近期战绩 + H2H 全部就绪</text>

    <!-- Dependency 4 -->
    <circle cx="30" cy="205" r="4" fill="#f59e0b"/>
    <text x="42" y="209" fill="#cbd5e1" font-size="11" font-weight="600">sync_live_scores → evaluate_predictions</text>
    <text x="42" y="225" fill="#94a3b8" font-size="10">实时比分更新比赛结果后，评估任务才能评判预测准确性</text>

    <!-- Dependency 5 -->
    <circle cx="30" cy="250" r="4" fill="#8b5cf6"/>
    <text x="42" y="254" fill="#cbd5e1" font-size="11" font-weight="600">generate_predictions ⇢ get_h2h_data (懒加载)</text>
    <text x="42" y="270" fill="#94a3b8" font-size="10">若 H2H 数据缺失，AI 预测时会自动调 API 获取 (兜底机制)</text>

    <!-- Dependency 6 -->
    <circle cx="30" cy="295" r="4" fill="#64748b"/>
    <text x="42" y="299" fill="#cbd5e1" font-size="11" font-weight="600">② 和 ③ 存在 H2H 同步重叠</text>
    <text x="42" y="315" fill="#94a3b8" font-size="10">② 为近3天比赛预取 H2H; ③ 为所有即将比赛同步。幂等设计，无冲突</text>
  </g>

  <!-- ============ EXTERNAL API SOURCES ============ -->
  <g transform="translate(940, 490)">
    <rect width="230" height="160" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" opacity="0.9"/>
    <text x="115" y="25" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">外部数据源</text>
